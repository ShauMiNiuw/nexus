function makeLearningPlan(x){
 const mins=Number(x.duration)||30, parts=[];
 if(x.level==='new')parts.push(['Überblick und Vorwissen',Math.max(3,Math.round(mins*.15)),'Notiere, was du schon weißt. Schau dir eine kurze Einführung an und formuliere 2–3 Fragen.']);
 else parts.push(['Aktiver Start',Math.max(3,Math.round(mins*.12)),'Rufe ohne Unterlagen ab, was du bereits weißt. Markiere Unsicherheiten.']);
 if(['Auswendig lernen','Vokabeln lernen','Formeln üben'].includes(x.goal))parts.push(['Abruftraining',Math.max(5,Math.round(mins*.35)),'Nutze Karteikarten oder Fragen. Antworte erst aus dem Kopf, dann kontrolliere und korrigiere.']);
 else parts.push(['Verstehen und untersuchen',Math.max(5,Math.round(mins*.3)),x.subject.includes('Programm')||x.subject.includes('Technik')?'Baue ein kleines Beispiel. Sage voraus, was passieren sollte, teste es und untersuche Abweichungen.':'Bearbeite ein Beispiel Schritt für Schritt. Erkläre, warum jeder Schritt nötig ist, und prüfe einen Gegenfall.']);
 parts.push(['Selbst anwenden',Math.max(5,Math.round(mins*.3)),x.goal==='Prüfung vorbereiten'?'Bearbeite eine Aufgabe ohne Hilfe und prüfe danach typische Fehler.':x.subject.includes('Programm')?'Implementiere eine kleine Funktion, teste Randfälle und verbessere den Code.':'Löse eine neue Aufgabe oder erkläre das Thema in eigenen Worten ohne Vorlage.']);
 parts.push(['Abschluss und Wiederholung',Math.max(2,mins-parts.reduce((s,p)=>s+p[1],0)),'Schreibe 1–3 Erkenntnisse und eine offene Frage auf. Plane eine kurze Wiederholung für später.']);
 return parts.map((p,i)=>`${i+1}. ${p[0]} (${p[1]} Min.)\n${p[2]}`).join('\n\n')
}

function importRecipes(file){
 if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const parsed=JSON.parse(String(reader.result||''));
   const incoming=Array.isArray(parsed)?parsed:Array.isArray(parsed?.recipes)?parsed.recipes:Array.isArray(parsed?.data?.recipes)?parsed.data.recipes:Array.isArray(parsed?.items)&&parsed?.type==='recipes'?parsed.items:null;
   if(!Array.isArray(incoming))throw new Error('Die Datei enthält keine Rezeptliste.');
   if(incoming.length>5000)throw new Error('Die Datei enthält zu viele Rezepte (maximal 5.000 pro Import).');
   const clean=incoming.filter(x=>x&&typeof x==='object'&&!Array.isArray(x)&&typeof x.title==='string'&&x.title.trim()).map(x=>({id:uid(),title:String(x.title).trim().slice(0,500),ingredients:String(x.ingredients??'').slice(0,30000),steps:String(x.steps??'').slice(0,50000),notes:String(x.notes??'').slice(0,20000),servings:String(x.servings??'').slice(0,120),duration:String(x.duration??'').slice(0,160),created:new Date().toISOString(),updated:new Date().toISOString(),done:false}));
   if(!clean.length)throw new Error('Es wurden keine gültigen Rezepte mit einem Namen gefunden.');
   const signature=x=>[x.title,x.ingredients,x.steps].map(v=>String(v||'').trim().toLocaleLowerCase('de-DE')).join('\u0000');
   const known=new Set((state.recipes||[]).map(signature));const unique=[];
   for(const item of clean){const key=signature(item);if(known.has(key))continue;known.add(key);unique.push(item)}
   state.recipes=[...unique,...(state.recipes||[])];save();renderPage('recipes');toast(unique.length+' neue Rezepte importiert'+(clean.length>unique.length?'; Duplikate übersprungen.':'.'));
  }catch(err){alert('Rezeptimport fehlgeschlagen: '+(err?.message||'Ungültige JSON-Datei.'))}
  const input=$('#recipe-import-file');if(input)input.value='';
 };
 reader.readAsText(file);
}

function updateStorageInfo(){const el=$('#storage-info');if(!el)return;try{const raw=localStorage.getItem(STORAGE_KEY)||'';el.textContent=(new Blob([raw]).size/1024).toFixed(1)+' KB in localStorage · '+Object.keys(state).filter(k=>Array.isArray(state[k])).length+' Datenbereiche'}catch(e){el.textContent='Nicht verfügbar'}}
function addNotification(title,body,kind='event',id=uid()){
 state.notifications=Array.isArray(state.notifications)?state.notifications:[];
 if(state.notifications.some(n=>n.id===id))return;
 state.notifications.unshift({id,title,body,kind,created:new Date().toISOString(),read:false,archived:false});
 if(state.notifications.length>150)state.notifications=state.notifications.slice(0,150);
 save();if(typeof renderNav==='function'&&$('#desktop-nav'))renderNav();
}

function calculateGrades(){
 const mode=state.gradeCalc?.mode||'grades',points=mode==='points',subjects=allGradeSubjects();let values=[];
 for(const [key,label] of subjects){const raw=state.gradeCalc?.values?.[key];if(raw===undefined||raw===null||String(raw).trim()==='')continue;const n=parseGradeValue(raw,points);if(n!==null)values.push({n,label})}
 const avg=values.length?values.reduce((a,x)=>a+x.n,0)/values.length:null,average=$('#grade-average-value'),label=$('#grade-average-label'),count=$('#grade-count'),status=$('#grade-status');if(!average||!label||!count||!status)return;
 count.textContent=values.length+' Fach'+(values.length===1?'':'ächer')+' eingetragen';
 if(avg===null){average.textContent='—';label.textContent='Noch keine gültigen Werte';status.innerHTML='<b>Bereit zum Rechnen</b>Trage mindestens eine Note oder Punktzahl ein. Leere Felder werden nicht berücksichtigt.';return}
 average.textContent=avg.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});label.textContent=(points?'Punktedurchschnitt':'Notendurchschnitt')+' · '+values.length+' von '+subjects.length+' Fächern';
 let heading,description,emoji;
 if(points){if(avg>=13){heading='Hervorragend';description='Ein sehr starkes Ergebnis im oberen Punktebereich.';emoji='🌟'}else if(avg>=10){heading='Gut';description='Ein gutes Ergebnis mit vielen starken Leistungen.';emoji='✨'}else if(avg>=7){heading='Solide';description='Ein solides Mittelfeld. Mit gezielter Übung sind weitere Punkte erreichbar.';emoji='👍'}else if(avg>=5){heading='Ausreichend';description='Du liegst im unteren Punktebereich. Es lohnt sich, einzelne Fächer gezielt zu stärken.';emoji='🧭'}else{heading='Ausbaufähig';description='Das Ergebnis ist noch ausbaufähig. Schau dir an, bei welchen Fächern du am meisten Unterstützung brauchst.';emoji='📘'}}
 else{if(avg<=1.5){heading='Hervorragend';description='Ein ausgezeichnetes Ergebnis mit sehr guten Noten.';emoji='🌟'}else if(avg<=2.5){heading='Gut';description='Ein gutes Ergebnis. Deine Leistungen sind insgesamt überzeugend.';emoji='✨'}else if(avg<=3.5){heading='Zufriedenstellend';description='Ein solides Ergebnis. Einzelne Fächer könnten deinen Schnitt noch verbessern.';emoji='👍'}else if(avg<=4){heading='Ausreichend';description='Der Schnitt ist gerade noch ausreichend. Ein Blick auf schwächere Fächer kann helfen.';emoji='🧭'}else if(avg<=5){heading='Ausbaufähig';description='Es gibt mehrere Bereiche, bei denen gezielte Unterstützung sinnvoll wäre.';emoji='📘'}else{heading='Kritisch';description='Der Schnitt zeigt, dass du in mehreren Fächern Unterstützung gebrauchen könntest. Sprich bei Bedarf mit einer Lehrkraft.';emoji='🤝'}}
 status.innerHTML=`<b>${emoji} ${heading}</b>${description}<p class="small-note" style="margin:10px 0 0">Orientierungshilfe, keine offizielle Zeugnisberechnung. Besondere Gewichtungen deiner Schule sind nicht enthalten.</p>`;
}
function parseGradeValue(raw,points){const s=String(raw??'').trim().replace(/[−–]/g,'-').replace(/\s+/g,'').replace(',','.');if(!s)return null;if(points){const n=Number(s);return Number.isFinite(n)&&n>=0&&n<=15?n:null}const marked=s.match(/^([1-5])([+-])$/);if(marked)return Number(marked[1])+(marked[2]==='+'?-0.3:0.3);const n=Number(s);return Number.isFinite(n)&&n>=1&&n<=6?n:null}
function gradeValues(text,points){return String(text??'').split(/[;]+/).map(x=>parseGradeValue(x,points)).filter(n=>n!==null)}
function averageNumbers(arr){const valid=arr.filter(n=>Number.isFinite(n));return valid.length?valid.reduce((a,b)=>a+b,0)/valid.length:null}
function calculateDetailedGrades(){
 const points=(state.gradeCalc?.mode||'grades')==='points';
 for(const x of state.gradeCalc.detailedSubjects||[]){
  const oralVals=[x.oral1,x.oral2].map(v=>parseGradeValue(v,points)).filter(n=>n!==null);
  const oralValsAll=[...oralVals,...gradeValues(x.vocabTests,points),...gradeValues(x.homeworkChecks,points)];
  const writtenVals=['exam1','exam2','exam3','exam4'].map(k=>parseGradeValue(x[k],points)).filter(n=>n!==null);
  const oral=averageNumbers(oralValsAll),written=averageNumbers(writtenVals),weight=Math.max(0,Math.min(100,Number(x.writtenWeight??50))),result=oral!==null&&written!==null?(oral*(100-weight)+written*weight)/100:oral!==null?oral:written;
  const out=$(`[data-detail-result="${x.id}"]`),explain=$(`[data-detail-explain="${x.id}"]`),wl=$(`[data-detail-weight-label="${x.id}"]`),ol=$(`[data-detail-oral-label="${x.id}"]`);
  if(out)out.textContent=result===null?'—':result.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
  if(explain)explain.textContent=result===null?'Fülle mindestens einen Notenbereich aus.':`Mündlicher Schnitt: ${oral===null?'—':oral.toLocaleString('de-DE',{maximumFractionDigits:2})} (${oralValsAll.length} Werte) · Schriftlicher Schnitt: ${written===null?'—':written.toLocaleString('de-DE',{maximumFractionDigits:2})} (${writtenVals.length} Arbeiten).`;
  if(wl)wl.textContent=weight+' %';if(ol)ol.textContent=(100-weight)+' %';
 }
}

function playClickSound(force=false){
 if(!force&&!state.settings.clickSound)return;
 try{
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  if(!clickAudioContext||clickAudioContext.state==='closed')clickAudioContext=new C();
  const ctx=clickAudioContext,volume=Math.max(0,Math.min(1,Number(state.settings.clickSoundVolume??65)/100));if(volume<=0)return;
  const type=state.settings.clickSoundType||'pip';
  const play=()=>{
   const now=ctx.currentTime;
   const tone=(wave,startFreq,endFreq,duration,level,offset=0)=>{const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=wave;osc.frequency.setValueAtTime(Math.max(1,startFreq),now+offset);if(endFreq!==startFreq)osc.frequency.exponentialRampToValueAtTime(Math.max(1,endFreq),now+offset+duration*.8);gain.gain.setValueAtTime(.0001,now+offset);gain.gain.exponentialRampToValueAtTime(Math.max(.0001,level*volume),now+offset+.006);gain.gain.exponentialRampToValueAtTime(.0001,now+offset+duration);osc.connect(gain);gain.connect(ctx.destination);osc.start(now+offset);osc.stop(now+offset+duration+.01)};
   if(type==='pip')tone('sine',force?1050:920,force?1320:1180,.075,.045);
   else if(type==='pop'){tone('sine',520,150,.13,.075);tone('triangle',220,90,.11,.026,.006)}
   else if(type==='digital')tone('square',force?880:760,force?220:170,.07,.026);
   else if(type==='soft')tone('sine',430,320,.16,.052);
   else if(type==='chime'){tone('sine',880,880,.18,.037);tone('sine',1320,1060,.22,.019,.018)}
   else if(type==='wood'){tone('triangle',300,85,.065,.06);tone('sine',180,75,.045,.024,.008)}
   else tone('triangle',560,390,.09,.04);
  };
  if(ctx.state==='suspended')ctx.resume().then(play).catch(()=>{});else play();
 }catch(e){}
}

 if(!tokens.length){const msg='Bitte nach /effect create mindestens ein Emoji angeben, z. B. 🌟✨.';console.info(msg);return msg}
 // Match the dense, screen-wide feel of the seasonal particle layers. The layer itself lasts exactly 60 seconds.
 const layer=document.createElement('div');layer.className='nexus-command-effects';layer.setAttribute('aria-hidden','true');layer.dataset.expiresAt=String(Date.now()+60000);
 const lowMotion=!!state.settings.reducedMotion||window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 const count=lowMotion?28:64;
 for(let i=0;i<count;i++){
   const emoji=tokens[i%tokens.length],particle=document.createElement('span');particle.className='nexus-command-emoji';particle.textContent=emoji;
   particle.style.setProperty('--x',(Math.random()*98)+'vw');particle.style.setProperty('--size',(lowMotion?17:20+Math.random()*30)+'px');
   particle.style.setProperty('--dur',(lowMotion?32:18+Math.random()*25)+'s');particle.style.setProperty('--delay',(-Math.random()*35)+'s');
   particle.style.setProperty('--drift',((Math.random()*34)-17)+'vw');particle.style.setProperty('--spin',(180+Math.random()*720)+'deg');particle.style.setProperty('--opacity',(lowMotion?.5:.65+Math.random()*.3).toFixed(2));layer.appendChild(particle);
 }
 document.body.appendChild(layer);setTimeout(()=>layer.remove(),60000);
 const msg='Temporärer Emoji-Effekt gestartet ('+count+' Partikel). Er endet nach exakt 60 Sekunden.';console.info(msg);return msg;
}

 if(e.target.id==='timer-minutes'){state.timer.minutes=Math.min(180,Math.max(1,Number(e.target.value)||25));if(!timerRunning)timerRemaining=state.timer.minutes*60;save()}
 if(e.target.id==='import-file'){}
  if(e.target.id==='recipe-import-file'&&e.target.files?.[0]){importRecipes(e.target.files[0]);e.target.value=''}
 if(e.target.id==='wb-image-file'&&e.target.files?.[0]){whiteboardAddImage(e.target.files[0]);e.target.value=''}
});
let draggedTaskId=null;
document.addEventListener('dragstart',e=>{const task=e.target.closest('[data-drag-task-id]');if(!task)return;draggedTaskId=task.dataset.dragTaskId;if(e.dataTransfer){e.dataTransfer.setData('text/plain',draggedTaskId);e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const day=e.target.closest('[data-calendar-drop="true"]');if(!day||!draggedTaskId)return;e.preventDefault();day.classList.add('drop-target');if(e.dataTransfer)e.dataTransfer.dropEffect='move'});
document.addEventListener('dragleave',e=>{const day=e.target.closest('[data-calendar-drop="true"]');if(day&&!day.contains(e.relatedTarget))day.classList.remove('drop-target')});
document.addEventListener('drop',e=>{const day=e.target.closest('[data-calendar-drop="true"]');if(!day)return;e.preventDefault();day.classList.remove('drop-target');const id=(e.dataTransfer&&e.dataTransfer.getData('text/plain'))||draggedTaskId;draggedTaskId=null;const task=state.tasks.find(x=>x.id===id);if(!task)return;task.due=day.dataset.date;selectedPlannerDate=day.dataset.date;state.settings.selectedPlannerDate=selectedPlannerDate;plannerMonth=new Date(selectedPlannerDate+'T12:00:00');plannerMonth=new Date(plannerMonth.getFullYear(),plannerMonth.getMonth(),1);save();renderPage('planner');toast('„'+task.title+'“ auf '+fmtDate(task.due)+' gelegt.')});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&$('#update-notice-overlay')){dismissUpdateNotice();return}if(e.key==='Escape'&&$('#secret-hunt-info-overlay')){closeSecretHuntInfo();return}if(e.key==='Escape'&&$('#secret-hunt-result-overlay')){closeSecretHuntResult();return}if(e.key==='Escape'&&$('#profile-modal-overlay')){$('#profile-modal-overlay').remove();return}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openGlobalSearch();return}
 if(e.key==='Escape')closeGlobalSearch();
 if(e.target?.id==='secret-effect-code'&&e.key==='Enter'){e.preventDefault();useSecretEffectCode();return}
 if(e.target?.id==='global-search-input'&&e.key==='Enter'){e.preventDefault();const first=$('#global-search-results .global-search-result')||$('#global-search-suggestions .search-suggestion');if(first)first.click();return}
 if(e.target?.id==='terminal-command'&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault();const input=e.target,commands=(state.settings.terminalHistory||[]).filter(x=>x.type==='command').map(x=>String(x.text||'').replace(/^nexus@local:~\$\s*/,'' )).slice(-10);if(!commands.length)return;if(e.key==='ArrowUp'){if(terminalHistoryIndex===0)terminalHistoryDraft=input.value;terminalHistoryIndex=Math.min(commands.length,terminalHistoryIndex+1);input.value=commands[commands.length-terminalHistoryIndex]||''}else{terminalHistoryIndex=Math.max(0,terminalHistoryIndex-1);input.value=terminalHistoryIndex?commands[commands.length-terminalHistoryIndex]:terminalHistoryDraft}input.setSelectionRange(input.value.length,input.value.length);return}
});
$('#global-search-overlay').addEventListener('click',e=>{if(e.target.id==='global-search-overlay')closeGlobalSearch()});
document.addEventListener('click',e=>{if(e.target.id==='secret-hunt-info-overlay')closeSecretHuntInfo();if(e.target.id==='secret-hunt-result-overlay')closeSecretHuntResult()});
$('#import-file').addEventListener('change',e=>handleImport(e.target.files[0],e.target.dataset.mode||'replace'));
window.addEventListener('resize',()=>{if(activePage==='whiteboard')whiteboardResizeCanvas()});
window.addEventListener('beforeunload',()=>{if(timerInterval)clearInterval(timerInterval);if(secretHuntInterval)clearInterval(secretHuntInterval)});
renderAll();
})();
</script>
</body>
</html>
