/* NEXUS 5.0: calmer dashboard, favorites, audio, multicolor accents */
:root{--accent3:#67f5b2;--accent4:#ffd166;--accent5:#ff83c8;--surface-gradient:linear-gradient(135deg,var(--bg),var(--panel))}
body{background:var(--surface-gradient)}

function migrateFlashcardCollections(){
 state.flashcardCollections=Array.isArray(state.flashcardCollections)?state.flashcardCollections:[];
 state.flashcards=Array.isArray(state.flashcards)?state.flashcards:[];
 if(!state.flashcardCollections.length&&state.flashcards.length){
  const collection={id:uid(),name:'Meine bisherige Sammlung',description:'Automatisch aus Karteikarten einer älteren NEXUS-Version übernommen.',created:new Date().toISOString()};
  state.flashcardCollections.push(collection);
  state.flashcards=state.flashcards.map(c=>({...c,collectionId:c.collectionId||collection.id}));
 }
 if(state.flashcardCollections.length){const fallback=state.flashcardCollections[0].id;state.flashcards=state.flashcards.map(c=>({...c,collectionId:c.collectionId||fallback}));if(!state.flashcardCollections.some(c=>c.id===state.settings.activeFlashcardCollectionId))state.settings.activeFlashcardCollectionId=fallback;}
}

function makeLearningPlan(x){
 const mins=Number(x.duration)||30, parts=[];
 if(x.level==='new')parts.push(['Überblick und Vorwissen',Math.max(3,Math.round(mins*.15)),'Notiere, was du schon weißt. Schau dir eine kurze Einführung an und formuliere 2–3 Fragen.']);
 else parts.push(['Aktiver Start',Math.max(3,Math.round(mins*.12)),'Rufe ohne Unterlagen ab, was du bereits weißt. Markiere Unsicherheiten.']);
 if(['Auswendig lernen','Vokabeln lernen','Formeln üben'].includes(x.goal))parts.push(['Abruftraining',Math.max(5,Math.round(mins*.35)),'Nutze Karteikarten oder Fragen. Antworte erst aus dem Kopf, dann kontrolliere und korrigiere.']);
 else parts.push(['Verstehen und untersuchen',Math.max(5,Math.round(mins*.3)),x.subject.includes('Programm')||x.subject.includes('Technik')?'Baue ein kleines Beispiel. Sage voraus, was passieren sollte, teste es und untersuche Abweichungen.':'Bearbeite ein Beispiel Schritt für Schritt. Erkläre, warum jeder Schritt nötig ist, und prüfe einen Gegenfall.']);
 parts.push(['Selbst anwenden',Math.max(5,Math.round(mins*.3)),x.goal==='Prüfung vorbereiten'?'Bearbeite eine Aufgabe ohne Hilfe und prüfe danach typische Fehler.':x.subject.includes('Programm')?'Implementiere eine kleine Funktion, teste Randfälle und verbessere den Code.':'Löse eine neue Aufgabe oder erkläre das Thema in eigenen Worten ohne Vorlage.']);
 parts.push(['Abschluss und Wiederholung',Math.max(2,mins-parts.reduce((s,p)=>s+p[1],0)),'Schreibe 1–3 Erkenntnisse und eine offene Frage auf. Plane eine kurze Wiederholung für später.']);
 return parts.map((p,i)=>`${i+1}. ${p[0]} (${p[1]} Min.)\n${p[2]}`).join('\n\n')
}

function importRecipes(file){
 if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const parsed=JSON.parse(String(reader.result||''));
   const incoming=Array.isArray(parsed)?parsed:Array.isArray(parsed?.recipes)?parsed.recipes:Array.isArray(parsed?.data?.recipes)?parsed.data.recipes:Array.isArray(parsed?.items)&&parsed?.type==='recipes'?parsed.items:null;
   if(!Array.isArray(incoming))throw new Error('Die Datei enthält keine Rezeptliste.');
   if(incoming.length>5000)throw new Error('Die Datei enthält zu viele Rezepte (maximal 5.000 pro Import).');
   const clean=incoming.filter(x=>x&&typeof x==='object'&&!Array.isArray(x)&&typeof x.title==='string'&&x.title.trim()).map(x=>({id:uid(),title:String(x.title).trim().slice(0,500),ingredients:String(x.ingredients??'').slice(0,30000),steps:String(x.steps??'').slice(0,50000),notes:String(x.notes??'').slice(0,20000),servings:String(x.servings??'').slice(0,120),duration:String(x.duration??'').slice(0,160),created:new Date().toISOString(),updated:new Date().toISOString(),done:false}));
   if(!clean.length)throw new Error('Es wurden keine gültigen Rezepte mit einem Namen gefunden.');
   const signature=x=>[x.title,x.ingredients,x.steps].map(v=>String(v||'').trim().toLocaleLowerCase('de-DE')).join('\u0000');
   const known=new Set((state.recipes||[]).map(signature));const unique=[];
   for(const item of clean){const key=signature(item);if(known.has(key))continue;known.add(key);unique.push(item)}
   state.recipes=[...unique,...(state.recipes||[])];save();renderPage('recipes');toast(unique.length+' neue Rezepte importiert'+(clean.length>unique.length?'; Duplikate übersprungen.':'.'));
  }catch(err){alert('Rezeptimport fehlgeschlagen: '+(err?.message||'Ungültige JSON-Datei.'))}
  const input=$('#recipe-import-file');if(input)input.value='';
 };
 reader.readAsText(file);
}

function updateStorageInfo(){const el=$('#storage-info');if(!el)return;try{const raw=localStorage.getItem(STORAGE_KEY)||'';el.textContent=(new Blob([raw]).size/1024).toFixed(1)+' KB in localStorage · '+Object.keys(state).filter(k=>Array.isArray(state[k])).length+' Datenbereiche'}catch(e){el.textContent='Nicht verfügbar'}}
function addNotification(title,body,kind='event',id=uid()){
 state.notifications=Array.isArray(state.notifications)?state.notifications:[];
 if(state.notifications.some(n=>n.id===id))return;
 state.notifications.unshift({id,title,body,kind,created:new Date().toISOString(),read:false,archived:false});
 if(state.notifications.length>150)state.notifications=state.notifications.slice(0,150);
 save();if(typeof renderNav==='function'&&$('#desktop-nav'))renderNav();
}
function ensureReleaseNotification(){
 state.notifications=Array.isArray(state.notifications)?state.notifications:[];
 if(!state.notifications.some(n=>n.id==='release-6.3.0')){state.notifications.unshift({id:'release-6.3.0',title:'NEXUS 6.3.0 – Rezepte, Noten & Lernbereich',body:`Neu in 6.3.0:
• Rezepte können als JSON exportiert und importiert werden. Der Import ergänzt vorhandene Rezepte und überspringt erkannte Duplikate. Zutaten und Zubereitungen unterstützen deutlich längere Texte.

• Karteikarten haben einen eigenen Bereich mit Sammlungen, Verwaltung, Import/Export und Lernrunden an einem Ort.
• Tagebuch und Traumtagebuch sind unter „Tagebücher“ gebündelt; die Einträge bleiben getrennt.
• Die Update-Begrüßung erscheint pro Release nur einmal. Notifications sind nach Aktualität sortiert.
• Temporäre Emoji-Effekte können in der Browser-Konsole mit nexus.command erstellt werden.`,kind:'release',created:new Date().toISOString(),read:false,archived:false});save()}
 if(!state.notifications.some(n=>n.id==='release-6.2.0')){state.notifications.unshift({id:'release-6.2.0',title:'NEXUS 6.2.0 – Stabilität & Backup Center',body:`NEXUS 6.2.0 legt den Schwerpunkt auf eine verlässlichere technische Grundlage und Datensicherheit.

Neu in 6.2.0:
• Wiederverwendbare Kernfunktionen für Backup-Erstellung und JSON-Importprüfung
• Schema-Version in vollständigen Backups
• Automatischer Sicherheits-Backup-Download vor einem Import, der vorhandene Daten ersetzt
• Datenintegritätsprüfung für grundlegende Strukturen und doppelte IDs
• Verbesserte Hinweise zu Importregeln und lokaler Datenspeicherung

Die Integritätsprüfung liest Daten nur aus und verändert sie nicht. Bestehende Bereiche und Daten sollen erhalten bleiben; erstelle dennoch regelmäßig externe Backups.`,kind:'release',created:new Date(Date.now()-60000).toISOString(),read:false,archived:false});save()}

function runTerminalCommand(){
 const input=$('#terminal-command'),command=(input?.value||'').trim();if(!command)return;input.value='';const add=(type,text)=>{state.settings.terminalHistory=Array.isArray(state.settings.terminalHistory)?state.settings.terminalHistory:[];state.settings.terminalHistory.push({type,text,time:new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'})});if(state.settings.terminalHistory.length>100)state.settings.terminalHistory=state.settings.terminalHistory.slice(-100)};

function calculateGrades(){

 const avg=values.length?values.reduce((a,x)=>a+x.n,0)/values.length:null,average=$('#grade-average-value'),label=$('#grade-average-label'),count=$('#grade-count'),status=$('#grade-status');if(!average||!label||!count||!status)return;

 if(avg===null){average.textContent='—';label.textContent='Noch keine gültigen Werte';status.innerHTML='<b>Bereit zum Rechnen</b>Trage mindestens eine Note oder Punktzahl ein. Leere Felder werden nicht berücksichtigt.';return}

function parseGradeValue(raw,points){const s=String(raw??'').trim().replace(/[−–]/g,'-').replace(/\s+/g,'').replace(',','.');if(!s)return null;if(points){const n=Number(s);return Number.isFinite(n)&&n>=0&&n<=15?n:null}const marked=s.match(/^([1-5])([+-])$/);if(marked)return Number(marked[1])+(marked[2]==='+'?-0.3:0.3);const n=Number(s);return Number.isFinite(n)&&n>=1&&n<=6?n:null}

function averageNumbers(arr){const valid=arr.filter(n=>Number.isFinite(n));return valid.length?valid.reduce((a,b)=>a+b,0)/valid.length:null}
function calculateDetailedGrades(){

  const writtenVals=['exam1','exam2','exam3','exam4'].map(k=>parseGradeValue(x[k],points)).filter(n=>n!==null);
  const oral=averageNumbers(oralValsAll),written=averageNumbers(writtenVals),weight=Math.max(0,Math.min(100,Number(x.writtenWeight??50))),result=oral!==null&&written!==null?(oral*(100-weight)+written*weight)/100:oral!==null?oral:written;

  if(out)out.textContent=result===null?'—':result.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
  if(explain)explain.textContent=result===null?'Fülle mindestens einen Notenbereich aus.':`Mündlicher Schnitt: ${oral===null?'—':oral.toLocaleString('de-DE',{maximumFractionDigits:2})} (${oralValsAll.length} Werte) · Schriftlicher Schnitt: ${written===null?'—':written.toLocaleString('de-DE',{maximumFractionDigits:2})} (${writtenVals.length} Arbeiten).`;

function importFlashcardCollection(file){const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(String(reader.result||''));const rawCards=Array.isArray(parsed)?parsed:(Array.isArray(parsed.cards)?parsed.cards:Array.isArray(parsed.flashcards)?parsed.flashcards:null);if(!rawCards)throw new Error('no-cards');const incoming=rawCards.filter(c=>c&&typeof c.front==='string'&&typeof c.back==='string');if(!incoming.length&&rawCards.length)throw new Error('invalid-cards');const meta=parsed.collection&&typeof parsed.collection==='object'?parsed.collection:{};let name=String(meta.name||parsed.collectionName||file.name.replace(/\.json$/i,'')).trim()||'Importierte Sammlung';const base=name;let suffix=2;while((state.flashcardCollections||[]).some(c=>c.name.toLocaleLowerCase('de-DE')===name.toLocaleLowerCase('de-DE'))){name=base+' ('+suffix++ +')'}const collection={id:uid(),name,description:String(meta.description||'Aus JSON importiert'),created:new Date().toISOString()};const now=new Date().toISOString();const clean=incoming.map(c=>({id:uid(),collectionId:collection.id,front:c.front.trim(),back:c.back.trim(),hint:String(c.hint||''),explanation:String(c.explanation||''),created:now,reps:Math.max(0,Number(c.reps)||0),wrongs:Math.max(0,Number(c.wrongs)||0),intervalDays:Math.max(0,Number(c.intervalDays)||0),due:String(c.due||''),lastReviewed:String(c.lastReviewed||'')})).filter(c=>c.front&&c.back);if(!clean.length)throw new Error('empty');state.flashcardCollections.unshift(collection);state.flashcards=[...clean,...(state.flashcards||[])];state.settings.activeFlashcardCollectionId=collection.id;flashcardEditId=null;flashcardSession=null;saveFlashcards();renderPage('flashcards');toast(clean.length+' Karten in Sammlung „'+name+'“ importiert.')}catch(err){toast('Import fehlgeschlagen: Bitte eine gültige NEXUS-Sammlungs-JSON mit cards sowie front/back verwenden.')}finally{const input=$('#flashcard-import');if(input)input.value=''}};reader.readAsText(file)}
document.addEventListener('click',e=>{const target=e.target.closest('[data-fc-action],[data-fc-grade]');if(!target)return;const action=target.dataset.fcAction;if(target.dataset.fcGrade){gradeFlashcard(target.dataset.fcGrade);return}if(action==='start-session'){startFlashcardSession()}else if(action==='reveal'){if(flashcardSession){flashcardSession.revealed=true;renderPage('flashcards')}}else if(action==='stop-session'){flashcardSession=null;renderPage('flashcards')}else if(action==='cancel-edit'){flashcardEditId=null;renderPage('flashcards')}else if(action==='edit'){flashcardEditId=target.dataset.id;renderPage('flashcards')}else if(action==='delete'){const id=target.dataset.id;if(confirm('Diese Karteikarte wirklich löschen?')){state.flashcards=state.flashcards.filter(c=>c.id!==id);if(flashcardSession){flashcardSession.queue=flashcardSession.queue.filter(x=>x!==id);if(flashcardSession.currentId===id)flashcardSession.currentId=null}if(flashcardEditId===id)flashcardEditId=null;saveFlashcards();renderPage('flashcards')}}else if(action==='export'){flashcardExport()}else if(action==='download-example'){downloadFlashcardExample()}});
document.addEventListener('change',e=>{if(e.target.id==='flashcard-collection-select'){state.settings.activeFlashcardCollectionId=e.target.value;flashcardEditId=null;flashcardSession=null;save();renderPage('flashcards');return}if(e.target.id==='flashcard-import'&&e.target.files?.[0])importFlashcardCollection(e.target.files[0])});
function handleFlashcardSubmit(e){
 e.preventDefault();const form=e.currentTarget,fd=new FormData(form),front=String(fd.get('front')||'').trim(),back=String(fd.get('back')||'').trim();if(!front||!back){toast('Bitte fülle Vorderseite und Rückseite aus.');return}
 const collection=currentFlashcardCollection();if(!collection){toast('Bitte erst eine Sammlung erstellen oder auswählen.');return}
 const id=String(fd.get('id')||''),all=Array.isArray(state.flashcards)?state.flashcards:[],previous=id?all.find(c=>String(c.id)===id&&c.collectionId===collection.id):null,now=new Date().toISOString();
 const card={id:previous?previous.id:uid(),collectionId:collection.id,front,back,hint:String(fd.get('hint')||'').trim(),explanation:String(fd.get('explanation')||'').trim(),created:previous?.created||now,reps:Number(previous?.reps)||0,wrongs:Number(previous?.wrongs)||0,intervalDays:Number(previous?.intervalDays)||0,due:previous?.due||'',lastReviewed:previous?.lastReviewed||''};
 if(previous)state.flashcards=all.map(c=>String(c.id)===id?card:c);else state.flashcards.unshift(card);
 flashcardEditId=null;saveFlashcards();renderPage('flashcards');toast(previous?'Karteikarte aktualisiert.':'Karteikarte gespeichert.');
}

document.addEventListener('submit',e=>{if(e.target?.id==='terminal-form'){e.preventDefault();runTerminalCommand();return}const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();const type=form.dataset.form,data=formValues(form);if(type==='rates'){saveItem(type,data);return}if(type==='learning')data.plan=makeLearningPlan(data);saveItem(type,data)});
document.addEventListener('input',e=>{
 if(e.target.matches('[data-search]')){searchText[e.target.dataset.search]=e.target.value;const pos=e.target.selectionStart;renderPage(activePage);const el=$(`[data-search="${e.target.dataset.search}"]`);if(el){el.focus();el.setSelectionRange(pos,pos)}}
 if(e.target.id==='vault-search'){window.vaultSearchQuery=e.target.value;const pos=e.target.selectionStart;renderPage('vault');const el=$('#vault-search');if(el){el.focus();el.setSelectionRange(pos,pos)}}
 if(e.target.id==='global-search-input'){if(e.target.value.trim().toLocaleLowerCase('de-DE')==='nexus+'&&!state.settings.youUnlocked){state.settings.youUnlocked=true;save();renderNav();toast('✦ Easter Egg entdeckt – You ist jetzt dauerhaft freigeschaltet!')}renderGlobalSearch(e.target.value)}
 if(e.target.matches('[data-grade-subject]')){state.gradeCalc.values[e.target.dataset.gradeSubject]=e.target.value;save();calculateGrades()}
  if(e.target.matches('[data-detail-id][data-detail-field]')){const x=(state.gradeCalc.detailedSubjects||[]).find(v=>v.id===e.target.dataset.detailId);if(x){const field=e.target.dataset.detailField;x[field]=e.target.value;if(field==='writtenWeight')x.weightsCustomized=true;save();calculateDetailedGrades()}}
 if(e.target.id==='click-sound-volume'){const v=Number(e.target.value);e.target.style.setProperty('--range-progress',v+'%');const label=e.target.closest('.field')?.querySelector('label');if(label)label.textContent='Klicksound-Lautstärke ('+v+' %)';state.settings.clickSoundVolume=v;save()}
 if(e.target.id==='text-lab')updateTextStats();
 if(e.target.id==='conv-value'||e.target.id==='conv-category'||e.target.id==='conv-from'||e.target.id==='conv-to'){const cat=$('#conv-category').value;if(e.target.id==='conv-category'){renderConverter();return}const from=$('#conv-from').value,to=$('#conv-to').value,val=$('#conv-value').value,n=convertValue(cat,val,from,to);$('#conv-result').textContent=Number.isFinite(n)?new Intl.NumberFormat('de-DE',{maximumSignificantDigits:12}).format(n)+' '+to:'Bitte einen gültigen Wert eingeben.'}
 if(/^accent[2-5]?-color$/.test(e.target.id)){const map={'accent-color':'accent','accent2-color':'accent2','accent3-color':'accent3','accent4-color':'accent4','accent5-color':'accent5'};state.settings[map[e.target.id]]=e.target.value;state.settings.theme='custom';state.settings.customBg=state.settings.customBg||'#080b13';state.settings.customPanel=state.settings.customPanel||'#101725';applyTheme();const idx={'accent-color':0,'accent2-color':1,'accent3-color':2,'accent4-color':3,'accent5-color':4}[e.target.id];const sw=$(`[data-preview-color="${idx}"]`);if(sw)sw.style.background=e.target.value;const barCode=sw?.parentElement?.querySelector('code');if(barCode)barCode.textContent=e.target.value.toUpperCase();const control=e.target.closest('.color-control')?.querySelector('.color-control-swatch');if(control)control.style.background=e.target.value;const code=e.target.closest('.color-control')?.querySelector('code');if(code)code.textContent=e.target.value.toUpperCase();const bgSw=$('[data-preview-color="5"]');if(bgSw)bgSw.style.background=`linear-gradient(125deg,${state.settings.customBg||themes[state.settings.theme]?.[0]||themes.cyber[0]},${state.settings.accent},${state.settings.accent2},${state.settings.accent3||'#67f5b2'},${state.settings.accent4||'#ffd166'},${state.settings.accent5||'#ff83c8'})`}
 if(e.target.id==='font-size'){state.settings.fontSize=Number(e.target.value);const value=$('#font-size-value');if(value)value.textContent=state.settings.fontSize;applyTheme();save()}
});
document.addEventListener('change',e=>{
 if(e.target.id==='background-style'){state.settings.backgroundStyle=e.target.value;save();applyTheme();const sw=$('[data-preview-color="5"]');if(sw)sw.style.background=state.settings.customBg||themes[state.settings.theme]?.[0]||themes.cyber[0]}
 if(e.target.id==='music-enabled'){state.settings.musicEnabled=e.target.checked;save();syncMusic();toast(e.target.checked?'Hintergrundmusik aktiviert.':'Hintergrundmusik deaktiviert.')}
 if(e.target.id==='click-sound'){state.settings.clickSound=e.target.checked;save();if(e.target.checked)playClickSound(true)}
  if(e.target.id==='click-sound-type'){state.settings.clickSoundType=e.target.value;save();playClickSound(true)}
  if(e.target.id==='seasonal-effects-toggle'){if(e.target.checked&&state.settings.activeEffectCode){const code=state.settings.activeEffectCode;state.settings.foundEffectCodes=Array.isArray(state.settings.foundEffectCodes)?state.settings.foundEffectCodes:[];if(!state.settings.foundEffectCodes.includes(code)){state.settings.foundEffectCodes.push(code);addNotification('Geheimnis entdeckt','Ein neuer geheimer Effekt wurde deiner Sammlung hinzugefügt. Sieh unter Einstellungen → Effekte nach.','secret')}state.settings.activeEffectCode=null}state.settings.seasonalEffects=e.target.checked;save();renderSeasonalEffects();renderFoundEffectCodes();renderNav();toast(e.target.checked?'Jahreszeiten-Effekte aktiviert.':'Jahreszeiten-Effekte deaktiviert.')}
 if(e.target.id==='click-sound-volume'){state.settings.clickSoundVolume=Number(e.target.value);e.target.style.setProperty('--range-progress',state.settings.clickSoundVolume+'%');save()}
 if(e.target.id==='vault-type-filter'){window.vaultTypeFilter=e.target.value;renderPage('vault')}
 if(e.target.id==='grade-mode'){state.gradeCalc.mode=e.target.value;save();renderPage('grades');calculateGrades()}
 if(e.target.matches('[data-grade-subject]')){state.gradeCalc.values[e.target.dataset.gradeSubject]=e.target.value;save();calculateGrades()}
  if(e.target.matches('[data-detail-id][data-detail-field]')){const x=(state.gradeCalc.detailedSubjects||[]).find(v=>v.id===e.target.dataset.detailId);if(x){const field=e.target.dataset.detailField;x[field]=e.target.value;if(field==='writtenWeight')x.weightsCustomized=true;else if(field==='type'&&!x.weightsCustomized){const w={hauptfach:50,nebenfach:30,profilkurs:40,leistungskurs:50,grundkurs:40,kurs:40,seminarkurs:20,wahlpflicht:40};x.writtenWeight=w[x.type]??50}save();if(field==='type'){renderPage('grades')}else calculateDetailedGrades()}}
 if(e.target.id==='hide-empty-sections'){state.settings.hideEmptySections=e.target.checked;save();renderPage('dashboard')}
 if(e.target.id==='more-animations'){state.settings.moreAnimations=e.target.checked;save();applyTheme()}
 if(e.target.id==='focus-mode'){state.settings.focusMode=e.target.value;save();applyFocusAndNavigation();renderNav();if(e.target.value!=='advanced'&&activePage==='terminal')go('settings');const d=$('#focus-description');if(d)d.textContent=focusDescription(e.target.value)}
 if(e.target.id==='nav-position'){state.settings.navPosition=e.target.value;save();applyFocusAndNavigation()}
 if(e.target.matches('[data-widget]')){const k=e.target.dataset.widget;if(e.target.checked&&!state.settings.dashboard.includes(k))state.settings.dashboard.push(k);if(!e.target.checked)state.settings.dashboard=state.settings.dashboard.filter(x=>x!==k);save();renderPage('settings')}
 if(e.target.id==='reduced-motion'){state.settings.reducedMotion=e.target.checked;save();applyTheme();renderSeasonalEffects()}
 if(e.target.id==='compact-mode'){state.settings.compact=e.target.checked;save();renderPage('settings')}
 if(e.target.id==='autosave'){state.settings.autosave=e.target.checked;save()}
 if(e.target.id==='confirm-delete'){state.settings.confirmDelete=e.target.checked;save()}
 if(e.target.id==='conv-category'){renderConverter()}
 if(e.target.id==='conv-from'||e.target.id==='conv-to'){const cat=$('#conv-category').value,n=convertValue(cat,$('#conv-value').value,$('#conv-from').value,$('#conv-to').value);$('#conv-result').textContent=Number.isFinite(n)?new Intl.NumberFormat('de-DE',{maximumSignificantDigits:12}).format(n)+' '+$('#conv-to').value:'Ungültiger Wert'}
 if(e.target.id==='timer-minutes'){state.timer.minutes=Math.min(180,Math.max(1,Number(e.target.value)||25));if(!timerRunning)timerRemaining=state.timer.minutes*60;save()}
 if(e.target.id==='import-file'){}
  if(e.target.id==='recipe-import-file'&&e.target.files?.[0]){importRecipes(e.target.files[0]);e.target.value=''}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#update-notice-overlay')){dismissUpdateNotice();return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openGlobalSearch()}if(e.key==='Escape')closeGlobalSearch()});
$('#global-search-overlay').addEventListener('click',e=>{if(e.target.id==='global-search-overlay')closeGlobalSearch()});
$('#import-file').addEventListener('change',e=>handleImport(e.target.files[0],e.target.dataset.mode||'replace'));
window.addEventListener('beforeunload',()=>{if(timerInterval)clearInterval(timerInterval)});
renderAll();
})();
</script>
