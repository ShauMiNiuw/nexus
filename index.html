function makeLearningPlan(x){
 const mins=Number(x.duration)||30, parts=[];
 if(x.level==='new')parts.push(['Überblick und Vorwissen',Math.max(3,Math.round(mins*.15)),'Notiere, was du schon weißt. Schau dir eine kurze Einführung an und formuliere 2–3 Fragen.']);
 else parts.push(['Aktiver Start',Math.max(3,Math.round(mins*.12)),'Rufe ohne Unterlagen ab, was du bereits weißt. Markiere Unsicherheiten.']);
 if(['Auswendig lernen','Vokabeln lernen','Formeln üben'].includes(x.goal))parts.push(['Abruftraining',Math.max(5,Math.round(mins*.35)),'Nutze Karteikarten oder Fragen. Antworte erst aus dem Kopf, dann kontrolliere und korrigiere.']);
 else parts.push(['Verstehen und untersuchen',Math.max(5,Math.round(mins*.3)),x.subject.includes('Programm')||x.subject.includes('Technik')?'Baue ein kleines Beispiel. Sage voraus, was passieren sollte, teste es und untersuche Abweichungen.':'Bearbeite ein Beispiel Schritt für Schritt. Erkläre, warum jeder Schritt nötig ist, und prüfe einen Gegenfall.']);
 parts.push(['Selbst anwenden',Math.max(5,Math.round(mins*.3)),x.goal==='Prüfung vorbereiten'?'Bearbeite eine Aufgabe ohne Hilfe und prüfe danach typische Fehler.':x.subject.includes('Programm')?'Implementiere eine kleine Funktion, teste Randfälle und verbessere den Code.':'Löse eine neue Aufgabe oder erkläre das Thema in eigenen Worten ohne Vorlage.']);
 parts.push(['Abschluss und Wiederholung',Math.max(2,mins-parts.reduce((s,p)=>s+p[1],0)),'Schreibe 1–3 Erkenntnisse und eine offene Frage auf. Plane eine kurze Wiederholung für später.']);
 return parts.map((p,i)=>`${i+1}. ${p[0]} (${p[1]} Min.)\n${p[2]}`).join('\n\n')
}

function calculateGrades(){

 for(const [key,label] of subjects){const raw=state.gradeCalc?.values?.[key];if(raw===undefined||raw===null||String(raw).trim()==='')continue;const n=Number(raw);if(Number.isFinite(n)&&n>=1&&n<=(points?15:6))values.push({n,label})}
 const avg=values.length?values.reduce((a,x)=>a+x.n,0)/values.length:null,average=$('#grade-average-value'),label=$('#grade-average-label'),count=$('#grade-count'),status=$('#grade-status');if(!average||!label||!count||!status)return;

 if(avg===null){average.textContent='—';label.textContent='Noch keine gültigen Werte';status.innerHTML='<b>Bereit zum Rechnen</b>Trage mindestens eine Note oder Punktzahl ein. Leere Felder werden nicht berücksichtigt.';return}
 average.textContent=avg.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});label.textContent=(points?'Punktedurchschnitt':'Notendurchschnitt')+' · '+values.length+' von '+subjects.length+' Fächern';

 else{if(avg<=1.5){heading='Hervorragend';description='Ein ausgezeichnetes Ergebnis mit sehr guten Noten.';emoji='🌟'}else if(avg<=2.5){heading='Gut';description='Ein gutes Ergebnis. Deine Leistungen sind insgesamt überzeugend.';emoji='✨'}else if(avg<=3.5){heading='Zufriedenstellend';description='Ein solides Ergebnis. Einzelne Fächer könnten deinen Schnitt noch verbessern.';emoji='👍'}else if(avg<=4){heading='Ausreichend';description='Der Schnitt ist gerade noch ausreichend. Ein Blick auf schwächere Fächer kann helfen.';emoji='🧭'}else if(avg<=5){heading='Ausbaufähig';description='Es gibt mehrere Bereiche, bei denen gezielte Unterstützung sinnvoll wäre.';emoji='📘'}else{heading='Kritisch';description='Der Schnitt zeigt, dass du in mehreren Fächern Unterstützung gebrauchen könntest. Sprich bei Bedarf mit einer Lehrkraft.';emoji='🤝'}}
 status.innerHTML=`<b>${emoji} ${heading}</b>${description}<p class="small-note" style="margin:10px 0 0">Orientierungshilfe, keine offizielle Zeugnisberechnung. Besondere Gewichtungen deiner Schule sind nicht enthalten.</p>`;
}
function gradeValues(text,points){return String(text??'').split(/[;]+/).map(x=>x.trim()).filter(Boolean).map(x=>Number(x.replace(',','.'))).filter(n=>Number.isFinite(n)&&n>=1&&n<=(points?15:6))}
function averageNumbers(arr){const valid=arr.filter(n=>Number.isFinite(n));return valid.length?valid.reduce((a,b)=>a+b,0)/valid.length:null}
function calculateDetailedGrades(){
 const points=(state.gradeCalc?.mode||'grades')==='points';
 for(const x of state.gradeCalc.detailedSubjects||[]){
  const oralVals=[x.oral1,x.oral2].map(v=>String(v??'').trim()===''?null:Number(v)).filter(n=>n!==null&&Number.isFinite(n)&&n>=1&&n<=(points?15:6));

  const writtenVals=['exam1','exam2','exam3','exam4'].map(k=>String(x[k]??'').trim()===''?null:Number(x[k])).filter(n=>n!==null&&Number.isFinite(n)&&n>=1&&n<=(points?15:6));
  const oral=averageNumbers(oralValsAll),written=averageNumbers(writtenVals),weight=Math.max(0,Math.min(100,Number(x.writtenWeight??50))),result=oral!==null&&written!==null?(oral*(100-weight)+written*weight)/100:oral!==null?oral:written;

 }
}

function playClickSound(force=false){
 if(!force&&!state.settings.clickSound)return;
 try{
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  if(!clickAudioContext||clickAudioContext.state==='closed')clickAudioContext=new C();
  const ctx=clickAudioContext,volume=Math.max(0,Math.min(1,Number(state.settings.clickSoundVolume??65)/100));if(volume<=0)return;
  const type=state.settings.clickSoundType||'pip';
  const play=()=>{
   const now=ctx.currentTime;
   const tone=(wave,startFreq,endFreq,duration,level,offset=0)=>{const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=wave;osc.frequency.setValueAtTime(Math.max(1,startFreq),now+offset);if(endFreq!==startFreq)osc.frequency.exponentialRampToValueAtTime(Math.max(1,endFreq),now+offset+duration*.8);gain.gain.setValueAtTime(.0001,now+offset);gain.gain.exponentialRampToValueAtTime(Math.max(.0001,level*volume),now+offset+.006);gain.gain.exponentialRampToValueAtTime(.0001,now+offset+duration);osc.connect(gain);gain.connect(ctx.destination);osc.start(now+offset);osc.stop(now+offset+duration+.01)};
   if(type==='pip')tone('sine',force?1050:920,force?1320:1180,.075,.045);
   else if(type==='pop'){tone('sine',520,150,.13,.075);tone('triangle',220,90,.11,.026,.006)}
   else if(type==='digital')tone('square',force?880:760,force?220:170,.07,.026);
   else if(type==='soft')tone('sine',430,320,.16,.052);
   else if(type==='chime'){tone('sine',880,880,.18,.037);tone('sine',1320,1060,.22,.019,.018)}
   else if(type==='wood'){tone('triangle',300,85,.065,.06);tone('sine',180,75,.045,.024,.008)}
   else tone('triangle',560,390,.09,.04);
  };
  if(ctx.state==='suspended')ctx.resume().then(play).catch(()=>{});else play();
 }catch(e){}
}

  if(e.target.matches('[data-detail-id][data-detail-field]')){const x=(state.gradeCalc.detailedSubjects||[]).find(v=>v.id===e.target.dataset.detailId);if(x){const field=e.target.dataset.detailField;x[field]=e.target.value;if(field==='writtenWeight')x.weightsCustomized=true;else if(field==='type'&&!x.weightsCustomized){const w={hauptfach:50,nebenfach:30,profilkurs:40,leistungskurs:50,grundkurs:40,kurs:40,seminarkurs:20,wahlpflicht:40};x.writtenWeight=w[x.type]??50}save();if(field==='type'){renderPage('grades')}else calculateDetailedGrades()}}
 if(e.target.id==='hide-empty-sections'){state.settings.hideEmptySections=e.target.checked;save();renderPage('dashboard')}
 if(e.target.id==='more-animations'){state.settings.moreAnimations=e.target.checked;save();applyTheme()}
 if(e.target.id==='focus-mode'){state.settings.focusMode=e.target.value;save();applyFocusAndNavigation();const d=$('#focus-description');if(d)d.textContent=focusDescription(e.target.value)}
 if(e.target.id==='nav-position'){state.settings.navPosition=e.target.value;save();applyFocusAndNavigation()}
 if(e.target.matches('[data-widget]')){const k=e.target.dataset.widget;if(e.target.checked&&!state.settings.dashboard.includes(k))state.settings.dashboard.push(k);if(!e.target.checked)state.settings.dashboard=state.settings.dashboard.filter(x=>x!==k);save();renderPage('settings')}
 if(e.target.id==='reduced-motion'){state.settings.reducedMotion=e.target.checked;save();applyTheme();renderSeasonalEffects()}
 if(e.target.id==='compact-mode'){state.settings.compact=e.target.checked;save();renderPage('settings')}
 if(e.target.id==='autosave'){state.settings.autosave=e.target.checked;save()}
 if(e.target.id==='confirm-delete'){state.settings.confirmDelete=e.target.checked;save()}
 if(e.target.id==='conv-category'){renderConverter()}
 if(e.target.id==='conv-from'||e.target.id==='conv-to'){const cat=$('#conv-category').value,n=convertValue(cat,$('#conv-value').value,$('#conv-from').value,$('#conv-to').value);$('#conv-result').textContent=Number.isFinite(n)?new Intl.NumberFormat('de-DE',{maximumSignificantDigits:12}).format(n)+' '+$('#conv-to').value:'Ungültiger Wert'}
 if(e.target.id==='timer-minutes'){state.timer.minutes=Math.min(180,Math.max(1,Number(e.target.value)||25));if(!timerRunning)timerRemaining=state.timer.minutes*60;save()}
 if(e.target.id==='import-file'){}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#update-notice-overlay')){dismissUpdateNotice();return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openGlobalSearch()}if(e.key==='Escape')closeGlobalSearch()});
$('#global-search-overlay').addEventListener('click',e=>{if(e.target.id==='global-search-overlay')closeGlobalSearch()});
$('#import-file').addEventListener('change',e=>handleImport(e.target.files[0],e.target.dataset.mode||'replace'));
window.addEventListener('beforeunload',()=>{if(timerInterval)clearInterval(timerInterval)});
renderAll();
})();
